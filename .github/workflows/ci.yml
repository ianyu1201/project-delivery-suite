name: Bundle CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bundle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate bundle (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin bundle
        run: |
          python -B scripts/validate_bundle.py
          python -B scripts/validate_release_sync.py
      - name: Compile Python files
        run: |
          python -B -m compileall -q scripts plugins/project-delivery-suite/skills distributions/workbuddy
      - name: Test delivery orchestrator
        run: |
          python -B -m unittest discover \
            -s plugins/project-delivery-suite/skills/project-delivery-orchestrator/scripts \
            -p 'test_*.py' -v
      - name: Test version consolidator
        run: |
          python -B -m unittest discover \
            -s plugins/project-delivery-suite/skills/consolidate-project-versions/scripts \
            -p 'test_*.py' -v
      - name: Test WorkBuddy distribution
        run: |
          python -B -m unittest discover \
            -s distributions/workbuddy/tests \
            -p 'test_*.py' -v
          python -B scripts/build_workbuddy_package.py
          python -B distributions/workbuddy/tests/validate_workbuddy_package.py
      - name: Smoke-test CLIs
        run: |
          python plugins/project-delivery-suite/skills/project-delivery-orchestrator/scripts/project_snapshot.py --help >/dev/null
          python plugins/project-delivery-suite/skills/project-delivery-orchestrator/scripts/scaffold_delivery.py --help >/dev/null
          python plugins/project-delivery-suite/skills/consolidate-project-versions/scripts/audit_versions.py --help >/dev/null
